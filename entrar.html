<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="emdia-versao" content="d6eb3565ac5d" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — EmDia</title>
  <meta name="description" content="Entrar na sua conta." />
  <link rel="icon" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="web/biblioteca/emdia.css?v=677fa39c" />
</head>
<body>

<div class="ed-entrada" id="entrada">
  <div class="ed-entrada-cartao">
    <div class="ed-entrada-marca">
      <img src="web/marca/emdia-marca.png" alt="" />
      <div>
        <b>EmDia</b>
        <small>Entrar</small>
      </div>
    </div>
    <form id="form-login">
      <div class="ed-campo">
        <label for="email">Email de login</label>
        <input id="email" name="email" type="email" required autocomplete="username"
               placeholder="nome@prepara.pt" />
      </div>
      <div class="ed-campo ed-campo-senha" style="margin:0">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required autocomplete="current-password"
               placeholder="A sua senha" />
        <button type="button" class="ed-ver-senha" id="btn-ver-senha"
                aria-pressed="false" aria-controls="senha">Mostrar</button>
      </div>
      <p class="ed-msg" style="margin-top:var(--ed-e3)"></p>
      <button type="submit" class="ed-botao ed-botao-primario" style="width:100%;margin-top:var(--ed-e4)">Entrar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
<script src="web/biblioteca/emdia.js?v=13c1e9d4"></script>
<script src="entrar.js?v=841bbd25"></script>
</body>
</html>
