<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="emdia-versao" content="d6eb3565ac5d" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — EmDia</title>
  <meta name="description" content="Os dados da sua empresa." />
  <link rel="icon" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="web/biblioteca/emdia.css?v=677fa39c" />
</head>
<body>

<div class="ed-a-verificar" id="a-verificar"><p class="ed-vazio">A verificar sessão…</p></div>
<div class="ed-entrada" id="entrada" hidden>
  <div class="ed-entrada-cartao">
    <div class="ed-entrada-marca">
      <img src="web/marca/emdia-marca.png" alt="" />
      <div><b>EmDia</b><small>Entrar</small></div>
    </div>
    <form id="form-login">
      <div class="ed-campo">
        <label for="email">Email de login</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="nome@prepara.pt" />
      </div>
      <div class="ed-campo ed-campo-senha" style="margin:0">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required autocomplete="current-password" placeholder="A sua senha" />
        <button type="button" class="ed-ver-senha" id="btn-ver-senha" aria-pressed="false" aria-controls="senha">Mostrar</button>
      </div>
      <p class="ed-msg" style="margin-top:var(--ed-e3)"></p>
      <button type="submit" class="ed-botao ed-botao-primario" style="width:100%;margin-top:var(--ed-e4)">Entrar</button>
    </form>
  </div>
</div>

<div class="ed-pagina" id="painel" hidden>
  <header id="topo"></header>
  <main class="ed-env" style="max-width:520px;padding-top:var(--ed-e5)">
    <h1 class="ed-h1" style="margin-bottom:var(--ed-e4)">Perfil</h1>

    <div class="ed-cartao" style="text-align:center;margin-bottom:var(--ed-e4)">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--ed-superficie-elevada);display:grid;place-items:center;margin:0 auto var(--ed-e3)">
        <span class="ed-icone ed-icone-24 i-utilizador" aria-hidden="true" style="color:var(--ed-primario-claro)"></span>
      </div>
      <p class="ed-h2" id="perfil-nome">—</p>
      <p class="ed-caption" id="perfil-cedula"></p>
    </div>

    <div class="ed-cartao" style="margin-bottom:var(--ed-e4)">
      <p class="bib-tipo-rotulo" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ed-texto-suave);margin-bottom:10px">Resumo</p>
      <div class="ed-fila" style="justify-content:space-between">
        <span class="ed-suave">Total já pago à EmDia</span>
        <span class="ed-label" id="perfil-total-pago">€ 0,00</span>
      </div>
    </div>

    <button type="button" class="ed-botao ed-botao-perigoso" style="width:100%" id="btn-sair-perfil">Sair da conta</button>
  </main>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
<script src="web/biblioteca/emdia.js?v=13c1e9d4"></script>
<script src="web/atualizar.js?v=4f2f0b42"></script>
<script src="app-contas.js?v=4c0d0175"></script>
<script src="perfil.js?v=28af1207"></script>
</body>
</html>
